<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Gabaritos de Chicotes</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#152536;background:#eef3f8}*{box-sizing:border-box}body{margin:0}header{background:#102f4f;color:#fff;padding:20px 28px;display:flex;justify-content:space-between;gap:16px;align-items:center}h1,h2,p{margin:0}h1{font-size:24px}header p{color:#c7d8e8;margin-top:5px}.tag{font-size:11px;color:#7dd3fc;letter-spacing:.15em}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.fileButton{border:0;border-radius:8px;padding:9px 12px;background:#0878c9;color:#fff;font-weight:650;cursor:pointer;font-size:13px}.secondary{background:#e4edf5;color:#173b59}.danger{background:#fde1df;color:#a51d17}main{max-width:1600px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d5e0ea;border-radius:13px;padding:16px;box-shadow:0 4px 14px #17324d14}.project{margin-bottom:16px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.title h2{font-size:17px}.grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:650;color:#496176}input,select,textarea{padding:9px;border:1px solid #b9c8d6;border-radius:8px;width:100%;background:#fff}.wide{grid-column:span 2}.workspace{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px}.list{max-height:650px;overflow:auto;display:flex;flex-direction:column;gap:8px}.item{border:1px solid #d4e0ea;border-radius:9px;padding:10px;cursor:pointer}.item:hover{border-color:#0878c9}.itemTop{display:flex;justify-content:space-between;gap:8px}.meta{font-size:12px;color:#60788c;margin-top:5px}.badge{font-size:10px;border-radius:99px;padding:3px 7px;background:#fff1be;color:#725700}.badge.ok{background:#dcf6e5;color:#126335}.canvasWrap{overflow:auto;background:#eaf1f6;border:1px solid #d1dee9;border-radius:9px;padding:10px}svg{display:block;background:#fff;width:100%;min-width:760px;aspect-ratio:10/3;border:1px solid #b5c4d1}.notice{margin-top:12px;padding:11px;border-radius:8px;background:#fff4ca;color:#655000}.notice.ok{background:#ddf6e6;color:#125c31}.hidden{display:none!important}dialog{border:0;border-radius:14px;padding:19px;width:min(760px,94vw);box-shadow:0 20px 60px #0005}dialog::backdrop{background:#102f4f88}.dialogBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.pdfRow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.fileButton input{display:none}iframe{width:100%;height:400px;border:1px solid #ccd8e3;border-radius:9px;margin-top:12px}@media(max-width:900px){.workspace{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}header{align-items:flex-start;flex-direction:column}main{padding:10px}}
</style>
</head>
<body>
<header><div><div class="tag">POC ESTÁTICA</div><h1>Gerador de Gabaritos de Chicotes</h1><p>Funciona no navegador, sem Python e sem servidor local</p></div><div class="actions"><button id="newBtn" class="secondary">Novo</button><button id="saveBtn">Salvar no navegador</button></div></header>
<main>
<section class="card project"><div class="title"><h2>Projeto</h2><span id="status" class="meta">Não salvo</span></div>
<div class="grid"><label>Código<input id="code" value="NOVO"></label><label>Revisão<input id="revision" value="A"></label><label class="wide">Descrição<input id="description" value="Chicote elétrico"></label><label>Projeto salvo<select id="projects"><option value="">Selecione...</option></select></label><label>Largura (mm)<input id="width" type="number" value="3000"></label><label>Altura (mm)<input id="height" type="number" value="900"></label></div>
<div class="pdfRow"><label class="fileButton">Selecionar PDF local<input id="pdf" type="file" accept="application/pdf"></label><span id="pdfName" class="meta">Nenhum PDF selecionado. O arquivo não é enviado ao GitHub.</span><button id="togglePdf" class="secondary hidden">Mostrar/ocultar PDF</button><button id="exportJson" class="secondary">Exportar backup JSON</button><label class="fileButton secondary">Importar backup JSON<input id="importJson" type="file" accept="application/json,.json"></label></div><iframe id="pdfViewer" class="hidden"></iframe>
</section>
<section class="workspace"><aside class="card"><div class="title"><h2>Saídas</h2><button id="addBtn">+ Adicionar</button></div><div id="branchList" class="list"></div></aside>
<section class="card"><div class="title"><h2>Gabarito</h2><div class="actions"><button id="validateBtn" class="secondary">Validar</button><button id="exportSvg" class="secondary">Exportar SVG</button></div></div><div class="canvasWrap"><svg id="canvas"></svg></div><div id="message" class="notice hidden"></div></section></section>
</main>
<dialog id="editor"><form id="branchForm"><div class="title"><h2>Editar saída</h2></div><input id="branchId" type="hidden"><div class="grid"><label>Identificação<input id="connector" required placeholder="-X180#2"></label><label>Código componente<input id="component"></label><label class="wide">Descrição<input id="branchDescription"></label><label>Posição X (mm)<input id="x" type="number" min="0" required></label><label>Posição Y (mm)<input id="y" type="number" min="0" required></label><label>Comprimento (mm)<input id="length" type="number" min="0" required></label><label>Direção<select id="direction"><option value="up">Superior</option><option value="down">Inferior</option><option value="left">Esquerda</option><option value="right">Direita</option></select></label><label>Conferido<select id="checked"><option value="false">Não</option><option value="true">Sim</option></select></label><label class="wide">Observação<textarea id="notes"></textarea></label></div><div class="dialogBtns"><button type="button" id="cancelEdit" class="secondary">Cancelar</button><button type="submit">Aplicar</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id);let project={code:'NOVO',revision:'A',description:'Chicote elétrico',width_mm:3000,height_mm:900,branches:[]};let dragId=null,pdfUrl=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function syncFromForm(){project.code=$('code').value.trim()||'NOVO';project.revision=$('revision').value.trim();project.description=$('description').value.trim();project.width_mm=+$('width').value||3000;project.height_mm=+$('height').value||900}
function syncToForm(){$('code').value=project.code;$('revision').value=project.revision;$('description').value=project.description;$('width').value=project.width_mm;$('height').value=project.height_mm}
function end(b){let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.direction]||[0,-1];return[b.x+d[0]*b.length,b.y+d[1]*b.length]}
function dirty(){$('status').textContent='Alterações não salvas'}
function render(){syncFromForm();$('branchList').innerHTML=project.branches.map(b=>`<div class="item" data-id="${b.id}"><div class="itemTop"><strong>${esc(b.connector)}</strong><span><span class="badge ${b.checked?'ok':''}">${b.checked?'Conferido':'Pendente'}</span> <button class="danger" data-del="${b.id}">×</button></span></div><div class="meta">X ${b.x} · Y ${b.y} · ${b.length} mm · ${esc(b.direction)}</div></div>`).join('')||'<p class="meta">Nenhuma saída cadastrada.</p>';document.querySelectorAll('.item').forEach(e=>e.onclick=x=>{if(!x.target.dataset.del)openEditor(e.dataset.id)});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=x=>{x.stopPropagation();project.branches=project.branches.filter(b=>b.id!==e.dataset.del);render();dirty()});draw()}
function draw(){let s=$('canvas'),w=project.width_mm,h=project.height_mm,t=h/2;s.setAttribute('viewBox',`0 0 ${w} ${h}`);let c=`<rect width="${w}" height="${h}" fill="white"/><g stroke="#dce5ed" stroke-width="2">`;for(let x=0;x<=w;x+=100)c+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" opacity="${x%500===0?.7:.25}"/>`;for(let y=0;y<=h;y+=100)c+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" opacity="${y%500===0?.7:.25}"/>`;c+=`</g><line x1="40" y1="${t}" x2="${w-40}" y2="${t}" stroke="#183b56" stroke-width="12" stroke-linecap="round"/>`;for(const b of project.branches){let[ex,ey]=end(b),out=b.x<0||b.x>w||b.y<0||b.y>h||ex<0||ex>w||ey<0||ey>h;c+=`<g class="node" data-id="${b.id}" style="cursor:grab"><line x1="${b.x}" y1="${t}" x2="${b.x}" y2="${b.y}" stroke="#58758c" stroke-width="7"/><line x1="${b.x}" y1="${b.y}" x2="${ex}" y2="${ey}" stroke="${out?'#c62828':'#0878c9'}" stroke-width="8"/><circle cx="${b.x}" cy="${b.y}" r="16" fill="${b.checked?'#20a05a':'#f4b400'}" stroke="white" stroke-width="5"/><text x="${ex+15}" y="${ey-15}" font-size="34" font-weight="700" fill="#172536">${esc(b.connector)}</text></g>`}c+=`<text x="35" y="55" font-size="30" fill="#526a7c">${esc(project.code)} · Rev. ${esc(project.revision)} · ${w} × ${h} mm</text>`;s.innerHTML=c;document.querySelectorAll('.node').forEach(n=>n.onpointerdown=e=>{dragId=n.dataset.id;n.setPointerCapture(e.pointerId)})}
$('canvas').onpointermove=e=>{if(!dragId)return;let s=$('canvas'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(s.getScreenCTM().inverse());let b=project.branches.find(x=>x.id===dragId);b.x=Math.max(0,Math.min(project.width_mm,Math.round(p.x/10)*10));b.y=Math.max(0,Math.min(project.height_mm,Math.round(p.y/10)*10));draw()};$('canvas').onpointerup=()=>{if(dragId){dragId=null;render();dirty()}};
function openEditor(id){let b=project.branches.find(x=>x.id===id)||{id:crypto.randomUUID(),connector:'',component_code:'',description:'',x:100,y:project.height_mm/2,length:100,direction:'up',checked:false,notes:''};$('branchId').value=b.id;$('connector').value=b.connector;$('component').value=b.component_code;$('branchDescription').value=b.description;$('x').value=b.x;$('y').value=b.y;$('length').value=b.length;$('direction').value=b.direction;$('checked').value=String(b.checked);$('notes').value=b.notes;$('editor').showModal()}
$('addBtn').onclick=()=>openEditor();$('cancelEdit').onclick=()=>$('editor').close();$('branchForm').onsubmit=e=>{e.preventDefault();if(!e.target.reportValidity())return;let b={id:$('branchId').value,connector:$('connector').value.trim(),component_code:$('component').value.trim(),description:$('branchDescription').value.trim(),x:+$('x').value,y:+$('y').value,length:+$('length').value,direction:$('direction').value,checked:$('checked').value==='true',notes:$('notes').value.trim()},i=project.branches.findIndex(x=>x.id===b.id);if(i>=0)project.branches[i]=b;else project.branches.push(b);$('editor').close();render();dirty()};
function storageKey(){return'gabarito:'+project.code+':'+project.revision}function loadList(){let vals=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('gabarito:'))try{let p=JSON.parse(localStorage.getItem(k));vals.push(p)}catch{}}$('projects').innerHTML='<option value="">Selecione...</option>'+vals.map(p=>`<option value="${esc('gabarito:'+p.code+':'+p.revision)}">${esc(p.code)} · Rev ${esc(p.revision)}</option>`).join('')}
$('saveBtn').onclick=()=>{syncFromForm();localStorage.setItem(storageKey(),JSON.stringify(project));$('status').textContent='Salvo neste navegador';loadList()};$('projects').onchange=()=>{if(!$('projects').value)return;project=JSON.parse(localStorage.getItem($('projects').value));syncToForm();render();$('status').textContent='Projeto aberto'};$('newBtn').onclick=()=>{project={code:'NOVO',revision:'A',description:'Chicote elétrico',width_mm:3000,height_mm:900,branches:[]};syncToForm();render();dirty()};
['code','revision','description','width','height'].forEach(id=>$(id).oninput=()=>{render();dirty()});
$('pdf').onchange=e=>{let f=e.target.files[0];if(!f)return;if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(f);$('pdfViewer').src=pdfUrl;$('pdfName').textContent=f.name+' · arquivo somente local';$('togglePdf').classList.remove('hidden')};$('togglePdf').onclick=()=>$('pdfViewer').classList.toggle('hidden');
$('validateBtn').onclick=()=>{syncFromForm();let er=[],seen=new Set();for(const b of project.branches){let k=b.connector.toUpperCase();if(seen.has(k))er.push('Conector duplicado: '+b.connector);seen.add(k);if(!b.length)er.push('Sem comprimento: '+b.connector);let[ex,ey]=end(b);if(b.x<0||b.x>project.width_mm||b.y<0||b.y>project.height_mm||ex<0||ex>project.width_mm||ey<0||ey>project.height_mm)er.push('Fora da área: '+b.connector)}if(!project.branches.length)er.push('Nenhuma saída cadastrada.');let m=$('message');m.classList.remove('hidden','ok');if(er.length)m.innerHTML='<strong>Pendências</strong><ul>'+er.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';else{m.classList.add('ok');m.innerHTML=`<strong>Validação aprovada</strong><p>${project.branches.length} saída(s), sem duplicidades ou itens fora da área.</p>`}};
function download(name,blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('exportJson').onclick=()=>{syncFromForm();download(`projeto_${project.code}_rev_${project.revision}.json`,new Blob([JSON.stringify(project,null,2)],{type:'application/json'}))};$('importJson').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let p=JSON.parse(await f.text());if(!p.code||!Array.isArray(p.branches))throw Error();project=p;syncToForm();render();dirty()}catch{alert('Arquivo JSON inválido.')}};
$('exportSvg').onclick=()=>{syncFromForm();draw();let c=$('canvas').cloneNode(true);c.setAttribute('xmlns','http://www.w3.org/2000/svg');c.setAttribute('width',project.width_mm+'mm');c.setAttribute('height',project.height_mm+'mm');download(`gabarito_${project.code}_rev_${project.revision}.svg`,new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml'}))};loadList();render();
</script>
</body></html>
